name: Generate K8s Manifests

# Run on every push to main
on:
  push:
    branches:
      - main

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the GitHub bot can push commits back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for git diff in generate-manifests.sh

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.12.0'

      - name: Install Kustomize
        run: |
          cd /tmp
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.3
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Make script executable and run it
        run: |
          chmod +x ./generate-manifests.sh
          # Kustomize customFunction exec plugins must be executable too. Windows
          # checkouts don't carry the bit, and a non-executable plugin makes
          # 'kustomize build' fail and emit a 0-byte manifest (Rule #13).
          # Scoped to */plugins/* so the charts/ offline cache is never touched.
          find kustomize -path '*/plugins/*' -name '*.sh' -exec chmod +x {} +
          ./generate-manifests.sh --force

      - name: Detect non-deterministic renders (credential churn)
        run: |
          # A chart that mints a random credential whenever its `lookup` of the
          # live Secret comes back empty will emit different output on every
          # render, because offline `kustomize build` in CI never has a cluster
          # to look up. That silently rotated real credentials across six apps
          # before anyone noticed — Nextcloud (postgres + admin), paperless
          # (redis), photoprism (admin), Grafana (admin), CrowdSec (LAPI secret
          # + registration token). See CHANGELOG 2026-08-06.
          #
          # Rendering twice from identical inputs turns that class of bug into a
          # build failure. This deliberately tests determinism rather than
          # pattern-matching for "secret-looking" lines: any non-determinism is
          # a defect here, and matching on shape would both miss cases and
          # produce false positives.
          set -euo pipefail

          if [ ! -d manifests ]; then
            echo "::error::no manifests/ directory after render"
            exit 1
          fi

          cp -a manifests "$RUNNER_TEMP/render-a"
          ./generate-manifests.sh --force > /dev/null 2>&1

          if diff -rq "$RUNNER_TEMP/render-a" manifests > "$RUNNER_TEMP/churn.diff" 2>&1; then
            echo "✅ Render is deterministic — identical inputs produced identical manifests"
          else
            echo "::error::Render is NON-DETERMINISTIC. Identical inputs produced different manifests."
            echo ""
            echo "This is almost always a chart generating a random credential because its"
            echo "cluster lookup returned empty. Committing it rotates a live credential on"
            echo "every push. Fix by pinning the value with the chart's existingSecret option"
            echo "and a SealedSecret carrying the value already live in the cluster."
            echo ""
            echo "Differing paths:"
            cat "$RUNNER_TEMP/churn.diff"
            exit 1
          fi

      - name: Validate generated manifests
        run: |
          # globstar is OFF by default in the Actions bash; without it '**' collapses
          # to '*' and the glob below silently matches nothing, making this step a no-op.
          shopt -s globstar nullglob

          FAILED=0
          COUNT=0
          for manifest in manifests/**/_bootstrap.yaml; do
            COUNT=$((COUNT + 1))

            # Guard: Reject empty or near-empty manifests (0-byte deletion trap)
            SIZE=$(stat -c%s "$manifest" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 10 ]; then
              echo "❌ FATAL: $manifest is empty or near-empty (${SIZE} bytes) — refusing to commit"
              FAILED=1
              continue
            fi

            # Validate YAML structure and K8s schema conformance
            # --ignore-missing-schemas: skip CRDs (Cilium, Gateway API, etc.) that have no upstream schema
            # --summary: only show errors, not every valid resource
            kubeconform \
              --kubernetes-version 1.36.1 \
              --ignore-missing-schemas \
              --summary \
              --output text \
              "$manifest" || FAILED=1
          done

          # A zero-match run means the render produced nothing — that must fail loudly,
          # not report success.
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No _bootstrap.yaml found under manifests/ — render produced nothing"
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Manifest validation failed — aborting commit to prevent ArgoCD auto-sync of broken state"
            exit 1
          fi
          echo "✅ Validated $COUNT manifest(s) successfully"

      - name: Commit and Push generated manifests
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # The [skip ci] prevents this automated commit from triggering an infinite loop of actions
          commit_message: "chore: auto-generate K8s manifests [skip ci]" 
