# values-scots-lab.yaml for Nextcloud App
# force rebuild
# Nextcloud and Postgres on Ceph block storage

image:
  repository: nextcloud
  tag: 33.0.2-apache
  pullPolicy: IfNotPresent

# Right-size for homelab — PHP-Apache with document processing
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 8080

nextcloud:
  host: files.srbii.com
  database: postgresql

  # Admin credentials come from a SealedSecret (sealed-nextcloud-admin.yaml).
  # enabled:true suppresses the chart's own `nextcloud` Secret, which otherwise
  # renders the plaintext admin password into the committed manifest.
  # NOTE: values here are preserved as-is, not rotated — changing this Secret
  # does not change the already-provisioned Nextcloud account (that lives in
  # oc_users and needs `occ user:resetpassword`).
  existingSecret:
    enabled: true
    secretName: nextcloud-admin-creds
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password

  extraEnv:
    - name: OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: nextcloud-oidc-secret
          key: OIDC_CLIENT_ID
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: nextcloud-oidc-secret
          key: OIDC_CLIENT_SECRET
    - name: OIDC_ISSUER_URL
      valueFrom:
        secretKeyRef:
          name: nextcloud-oidc-secret
          key: OIDC_ISSUER_URL

  
  # Increase Apache header size limits for Cloudflare Tunnel JWT headers (Rule #26)
  extraVolumes:
    - name: apache-header-fix
      configMap:
        name: nextcloud-apache-header-fix
  extraVolumeMounts:
    - name: apache-header-fix
      mountPath: /etc/apache2/conf-enabled/cloudflare-headers.conf
      subPath: cloudflare-headers.conf

  # Set Trusted Domains
  configs:
    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => array('10.0.0.0/8', '192.168.0.0/16', '172.16.0.0/12'),
        'overwriteprotocol' => 'https',
      );
    trusted_domains.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_domains' => array(
          0 => 'files.srbii.com',
          1 => 'localhost',
          2 => '10.*',
          3 => '192.168.*',
        ),
      );

persistence:
  enabled: true
  storageClass: ceph-block
  size: 100Gi
  accessMode: ReadWriteOnce

# The application's DB credential comes from a SealedSecret
# (sealed-nextcloud-db.yaml). enabled:true suppresses the chart's `nextcloud-db`
# Secret, which rendered db-password in plaintext. The chart reads the app's DB
# env vars from whatever secretName is given here (templates/deployment.yaml),
# so this must line up with the postgresql block below.
externalDatabase:
  existingSecret:
    enabled: true
    secretName: nextcloud-db-creds
    usernameKey: db-username
    passwordKey: db-password

postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: "15.4.0-debian-11-r45"
  global:
    postgresql:
      auth:
        database: nextcloud
        username: nextcloud
        # Credentials come from a SealedSecret (sealed-nextcloud-postgresql.yaml).
        # This suppresses the subchart's own `nextcloud-postgresql` Secret, which
        # previously rendered the DB password in plaintext AND minted a fresh
        # random superuser password on every CI render (see CHANGELOG 2026-08-06).
        # The `password` key MUST stay identical to db-password in
        # sealed-nextcloud-db.yaml — both are the `nextcloud` role's password.
        existingSecret: nextcloud-postgresql-creds
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
  primary:
    persistence:
      enabled: true
      storageClass: ceph-block
      size: 20Gi
