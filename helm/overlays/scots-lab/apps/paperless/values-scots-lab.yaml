# Protect from eviction during disk pressure events
priorityClassName: homelab-data

env:
  TZ: "UTC"
  PAPERLESS_URL: "https://docs.srbii.com"
  PAPERLESS_ENABLE_ALLAUTH: "true"
  PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
  PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
  PAPERLESS_SOCIALACCOUNT_PROVIDERS:
    valueFrom:
      secretKeyRef:
        name: paperless-oidc-secret
        key: providers.json

global:
  security:
    allowInsecureImages: true

ingress:
  main:
    enabled: false

persistence:
  data:
    enabled: true
    storageClass: "ceph-block"
    accessMode: ReadWriteOnce
    size: 2Gi
    retain: true
  media:
    enabled: true
    storageClass: "ceph-block"
    accessMode: ReadWriteOnce
    size: 15Gi
    retain: true
  export:
    enabled: true
    storageClass: "ceph-block"
    accessMode: ReadWriteOnce
    size: 5Gi
    retain: true
  consume:
    enabled: true
    storageClass: "ceph-block"
    accessMode: ReadWriteOnce
    size: 4Gi
    retain: true

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.2.0-debian-11-r1
  auth:
    database: paperless
    # Credential comes from sealed-paperless-postgresql.yaml, suppressing the
    # subchart's own Secret which committed this password in plaintext.
    # NOTE: value is carried over unchanged, NOT rotated. paperless connects as
    # the postgres superuser (PAPERLESS_DBPASS <- postgres-password), so this is
    # a runtime credential — rotating it needs an ALTER USER landed together with
    # the render, which cannot be supervised while GitHub Actions is down.
    existingSecret: paperless-postgresql-creds
    secretKeys:
      adminPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      storageClass: "ceph-block"
      size: 10Gi

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.4.2-debian-12-r0
  auth:
    enabled: true
    # Credential comes from sealed-paperless-redis.yaml. Safe to rotate here:
    # the redis server and the paperless client both read this one Secret and
    # both restart when the secret name changes, so the new password applies
    # itself — no manual step, unlike the postgres credential above.
    existingSecret: paperless-redis-creds
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      storageClass: "ceph-block"
      size: 5Gi
  replica:
    replicaCount: 0

# Right-size the paperless-ngx worker to prevent memory starvation.
# CPU limit is intentionally omitted to allow rapid burst processing during OCR ingestion,
# but memory is strictly capped to prevent long-term memory leaks.
resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    memory: 1Gi

