# PhotoPrism Community Edition — scots-lab values
# CPU-only; no GPU acceleration. Initial indexing will be slower but fully functional.
# Chart: photoprism/photoprism-plus v1.0.4

image:
  repository: docker.io/photoprism/photoprism
  tag: "ce"
  pullPolicy: IfNotPresent

adminUser: "admin"
# Not a credential. The real admin password lives in sealed-photoprism-admin.yaml
# and is injected by photoprism-admin-env-patch.yaml, which replaces the env entry
# the chart wires to its own Secret. This value is only what the chart renders into
# that now-unreferenced Secret.
# Do NOT set this to "" — the chart falls back to `randAlphaNum 16` when its
# `lookup` finds no live Secret, which is always the case during offline CI
# renders, producing a new password on every build.
adminPassword: "unused-managed-via-sealedsecret"    # Fallback local admin — OIDC is primary auth

# OIDC — native chart block
# PHOTOPRISM_OIDC_SECRET is injected separately via SealedSecret envFrom patch
oidc:
  PHOTOPRISM_DISABLE_OIDC: false
  PHOTOPRISM_OIDC_URI: "https://auth.srbii.com/realms/homelab"
  PHOTOPRISM_OIDC_CLIENT: "photoprism-client"
  PHOTOPRISM_OIDC_SECRET: ""
  PHOTOPRISM_OIDC_REGISTER: true
  PHOTOPRISM_OIDC_PROVIDER: "Keycloak"
  PHOTOPRISM_OIDC_ICON: ""
  PHOTOPRISM_OIDC_REDIRECT: false
  PHOTOPRISM_OIDC_USERNAME: "preferred_username"

# Core PhotoPrism config
config:
  PHOTOPRISM_SITE_URL: "https://photos.srbii.com/"
  PHOTOPRISM_SITE_TITLE: "Photos"
  PHOTOPRISM_SITE_CAPTION: "AI-Powered Photos"
  PHOTOPRISM_DISABLE_TLS: true         # Rule #18: Cloudflare Tunnel terminates TLS
  PHOTOPRISM_DISABLE_STS: true
  PHOTOPRISM_UPLOAD_NSFW: true
  PHOTOPRISM_ORIGINALS_LIMIT: 50000    # 50 GB max file size (MB)
  PHOTOPRISM_AUTH_MODE: "password"
  PHOTOPRISM_LOG_LEVEL: "info"
  PHOTOPRISM_HTTP_COMPRESSION: "gzip"
  PHOTOPRISM_SESSION_MAXAGE: "1209600"

# SQLite database (chart default — no external DB needed for single-user homelab)
database:
  driver: "sqlite"

# Persistent storage on Ceph
# ── Sizing note (2026-08-10) ────────────────────────────────────────────────────
# `storage` is the binding constraint, NOT `originals`. It holds PhotoPrism's
# generated thumbnails and sidecar files, which scale with the library — plan on
# roughly 20-25% of the originals size. At the previous 10Gi it would have filled
# somewhere around 40-50 GiB of photos and stalled indexing long before the
# originals volume looked full.
#
# Raised to 500Gi originals / 125Gi storage (25%). Headroom check:
#   Ceph MAX AVAIL          : 26 TiB usable (88 TiB raw, size=3, failureDomain host)
#   currently stored         : 1.8 TiB, of which ~1.77 TiB is orphaned snapshots
#   CephPoolNearFull alert   : fires at 70% => keep the pool under ~18 TiB
# 500Gi consumes 1.5 TiB raw at size=3, which is comfortably inside that budget.
#
# ⚠️ Every GB here fans out to four more places — Ceph x3, Velero fs-backup to R2
# (the nightly critical-data-backup covers photoprism), the R2->Drive mirror, and
# the Tier-3B direct Drive copy. Budget roughly: 1 TB of photos ≈ 3 TB Ceph +
# ~1 TB R2 (~$15/mo) + ~2 TB Google Drive across two copies.
#
# ceph-block has allowVolumeExpansion: true, so these can be raised again later.
# They can never be SHRUNK — do not overshoot expecting to reclaim it.
persistence:
  storageClassName: "ceph-block"
  originals:
    enabled: true
    size: 500Gi          # was 100Gi
    accessModes:
      - ReadWriteOnce
  storage:
    enabled: true
    size: 125Gi          # was 10Gi — 25% of originals; this is the real constraint
    accessModes:
      - ReadWriteOnce

# Ingress disabled — using kGateway HTTPRoute + Cloudflare Tunnel
ingress:
  enabled: false

# Conservative resource requests to avoid Ceph CPU saturation
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 4Gi

# The photoprism:ce image uses s6-overlay which requires root to bootstrap
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: true

podSecurityContext:
  fsGroup: 0
