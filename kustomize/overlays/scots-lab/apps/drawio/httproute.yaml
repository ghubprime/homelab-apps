apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drawio
  namespace: drawio
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Draw.io
    gethomepage.dev/group: Tools
    gethomepage.dev/description: Diagram Editor
    gethomepage.dev/icon: diagrams-net.png
    gethomepage.dev/href: https://draw.srbii.com
    gethomepage.dev/weight: '40'
spec:
  parentRefs:
  - name: kgateway-http
    namespace: kgateway-system
  hostnames:
  - draw.srbii.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: drawio
      port: 4180
