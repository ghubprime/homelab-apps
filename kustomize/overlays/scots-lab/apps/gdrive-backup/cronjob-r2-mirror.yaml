apiVersion: batch/v1
kind: CronJob
metadata:
  name: gdrive-r2-mirror
  namespace: gdrive-backup
  labels:
    app.kubernetes.io/name: gdrive-backup
    app.kubernetes.io/component: r2-mirror
spec:
  schedule: "0 6 * * *"  # Daily at 6:00 AM UTC (11 PM PDT — outside 6-10 PM home hours)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gdrive-backup
            app.kubernetes.io/component: r2-mirror
        spec:
          automountServiceAccountToken: false
          containers:
          - name: rclone
            image: rclone/rclone:1.69
            command: ["/bin/sh", "-c"]
            args:
              - |
                cp /config/rclone.conf /tmp/rclone.conf
                echo "=== GDrive R2 Mirror: $(date -Iseconds) ==="
                echo "Copying R2 bucket to Google Drive..."

                rclone copy \
                  R2:homelab-velero-backups \
                  GDrive:velero-mirror \
                  --config /tmp/rclone.conf \
                  --transfers 4 \
                  --checkers 8 \
                  --log-level INFO \
                  --stats 60s \
                  --stats-one-line

                EXIT_CODE=$?
                # Rule #30 applies to this job as much as to anything in the cluster:
                # both healthcheck pings used to be commented out, so a failure of the ONLY
                # second off-site copy would have been completely silent. Now driven by an
                # optional Secret key — unset warns loudly rather than failing the backup.
                if [ $EXIT_CODE -eq 0 ]; then
                  echo "=== Mirror sync completed successfully ==="
                  if [ -n "${HEALTHCHECK_URL:-}" ]; then
                    curl -fsS -m 10 --retry 5 "$HEALTHCHECK_URL" > /dev/null || true
                  else
                    echo "WARNING: HEALTHCHECK_URL unset - the R2->GDrive mirror is UNMONITORED"
                  fi
                else
                  echo "=== Mirror sync FAILED with exit code $EXIT_CODE ==="
                  if [ -n "${HEALTHCHECK_URL:-}" ]; then
                    curl -fsS -m 10 --retry 5 "$HEALTHCHECK_URL/fail" > /dev/null || true
                  fi
                  exit $EXIT_CODE
                fi
            env:
              # Create a check in the `healthchecks` app, then add its ping URL to the
              # rclone-config Secret under this key. `optional: true` means the job keeps
              # working before you do, but every run logs that it is unmonitored.
              - name: HEALTHCHECK_URL
                valueFrom:
                  secretKeyRef:
                    name: rclone-config
                    key: healthcheck-url-r2-mirror
                    optional: true
            volumeMounts:
            - name: rclone-config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - name: tmp
            emptyDir: {}
