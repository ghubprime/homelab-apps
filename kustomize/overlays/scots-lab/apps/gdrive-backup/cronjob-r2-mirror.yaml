apiVersion: batch/v1
kind: CronJob
metadata:
  name: gdrive-r2-mirror
  namespace: gdrive-backup
  labels:
    app.kubernetes.io/name: gdrive-backup
    app.kubernetes.io/component: r2-mirror
spec:
  schedule: "0 3 * * *"  # Daily at 3:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gdrive-backup
            app.kubernetes.io/component: r2-mirror
        spec:
          automountServiceAccountToken: false
          containers:
          - name: rclone
            image: rclone/rclone:1.69
            command: ["/bin/sh", "-c"]
            args:
              - |
                echo "=== GDrive R2 Mirror: $(date -Iseconds) ==="
                echo "Copying R2 bucket to Google Drive..."

                rclone copy \
                  R2:homelab-velero-backups \
                  GDrive:velero-mirror \
                  --config /config/rclone.conf \
                  --transfers 4 \
                  --checkers 8 \
                  --log-level INFO \
                  --stats 60s \
                  --stats-one-line

                EXIT_CODE=$?
                if [ $EXIT_CODE -eq 0 ]; then
                  echo "=== Mirror sync completed successfully ==="
                  # Ping healthcheck on success (uncomment when configured)
                  # curl -fsS -m 10 --retry 5 https://ping.srbii.com/api/v1/ping/<UUID> > /dev/null
                else
                  echo "=== Mirror sync FAILED with exit code $EXIT_CODE ==="
                  # Ping healthcheck failure endpoint (uncomment when configured)
                  # curl -fsS -m 10 --retry 5 https://ping.srbii.com/api/v1/ping/<UUID>/fail > /dev/null
                  exit $EXIT_CODE
                fi
            volumeMounts:
            - name: rclone-config
              mountPath: /config
              readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
