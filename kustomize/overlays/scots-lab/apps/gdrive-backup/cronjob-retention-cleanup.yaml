apiVersion: batch/v1
kind: CronJob
metadata:
  name: gdrive-retention-cleanup
  namespace: gdrive-backup
  labels:
    app.kubernetes.io/name: gdrive-backup
    app.kubernetes.io/component: retention-cleanup
spec:
  schedule: "0 7 1 * *"  # 1st of every month at 7:00 AM UTC (12 AM PDT — outside 6-10 PM home hours)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600  # 1 hour timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gdrive-backup
            app.kubernetes.io/component: retention-cleanup
        spec:
          automountServiceAccountToken: false
          containers:
          - name: rclone
            image: rclone/rclone:1.69
            command: ["/bin/sh", "-c"]
            args:
              - |
                cp /config/rclone.conf /tmp/rclone.conf
                echo "=== GDrive Retention Cleanup: $(date -Iseconds) ==="

                echo "--- Pruning velero-mirror (>365 days) ---"
                rclone delete \
                  GDrive:velero-mirror \
                  --config /tmp/rclone.conf \
                  --min-age 365d \
                  --log-level INFO \
                  --stats-one-line \
                  --rmdirs
                echo "Velero mirror pruning complete."

                echo "--- Pruning pvc-snapshots (>180 days) ---"
                rclone delete \
                  GDrive:pvc-snapshots \
                  --config /tmp/rclone.conf \
                  --min-age 180d \
                  --log-level INFO \
                  --stats-one-line \
                  --rmdirs
                echo "PVC snapshots pruning complete."

                echo "--- Drive usage summary ---"
                rclone size GDrive:velero-mirror --config /tmp/rclone.conf --json 2>/dev/null | \
                  (cat; echo) | head -1
                rclone size GDrive:pvc-snapshots --config /tmp/rclone.conf --json 2>/dev/null | \
                  (cat; echo) | head -1

                echo "=== Retention cleanup complete ==="
            volumeMounts:
            - name: rclone-config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 256Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - name: tmp
            emptyDir: {}
