apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthchecks
  namespace: healthchecks
  labels:
    app: healthchecks
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: healthchecks
  template:
    metadata:
      labels:
        app: healthchecks
    spec:
      priorityClassName: homelab-data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: healthchecks
          # LinuxServer uses rolling ls-xxx tags; pinned to digest to prevent unnecessary pulls
          image: lscr.io/linuxserver/healthchecks@sha256:9c41e787577d7812f7b75d4bbf53a19697403ce7759c108dc772b85cd4531b58
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            - name: SITE_ROOT
              value: "https://ping.srbii.com"
            - name: SITE_NAME
              value: "Scots Lab Healthchecks"
            - name: REMOTE_USER_HEADER
              value: "HTTP_X_FORWARDED_USER"
            # Required for the ntfy integration. healthchecks refuses to open a
            # socket to a private IP unless this is set (hc/lib/curl.py), and
            # ntfy.ntfy.svc.cluster.local resolves to a ClusterIP in 10.0.0.0/8,
            # so every notification failed with "Connections to private IP
            # addresses are not allowed". Verified in-cluster 2026-10-20.
            # Safe here: only the operator can create integrations, behind
            # Keycloak, and every notification target is in-cluster.
            - name: INTEGRATIONS_ALLOW_PRIVATE_IPS
              value: "True"
          volumeMounts:
            - name: data
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
          args:
            - --provider=oidc
            - --provider-display-name=Keycloak
            - --oidc-issuer-url=https://auth.srbii.com/realms/homelab
            - --email-domain=*
            - --upstream=http://127.0.0.1:8000
            - --http-address=0.0.0.0:4180
            - --skip-auth-route=^/ping/.*
            - --pass-user-headers=false
            - --session-cookie-minimal=true
            - --cookie-domain=ping.srbii.com
            - --trusted-proxy-ip=10.244.0.0/16
          envFrom:
            - secretRef:
                name: healthchecks-oauth2-proxy-secret
          ports:
            - containerPort: 4180
              name: proxy
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: healthchecks-data
