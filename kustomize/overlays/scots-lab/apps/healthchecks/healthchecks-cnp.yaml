apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: healthchecks-isolation-baseline
  namespace: healthchecks
spec:
  # Default-deny ingress with explicit allowlist
  endpointSelector: {}
  ingress:
  # Allow ingress from kGateway (external traffic)
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kgateway-system
  # Allow Prometheus scraping
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-prometheus-system
  # Allow uptime-kuma health checks
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: uptime-kuma
  # Allow inbound pings from monitored services across all namespaces
  - fromEntities:
    - cluster

  egress:
  # Allow intra-namespace communication
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: healthchecks
  # Allow DNS resolution
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
  # Allow external egress for webhook notifications and OIDC
  - toEntities:
    - world
    - host
  - toCIDR:
    - 0.0.0.0/0
