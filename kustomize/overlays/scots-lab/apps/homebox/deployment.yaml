apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: homebox
  labels:
    app: homebox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homebox
  template:
    metadata:
      labels:
        app: homebox
    spec:
      priorityClassName: homelab-data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homebox
          # Pinned by DIGEST 2026-08-11. Was `:latest`.
          # homebox holds inventory data and runs schema migrations on start, so an unpinned
# upgrade can migrate the database out from under you with no way back.
          #
          # This digest is exactly what was already running when it was pinned, read from the
          # live pod's imageID - so this is a no-op for the running cluster and cannot drift.
          # A version tag was deliberately not guessed at; Renovate tracks digest pins via
          # pinDigest and will propose updates as reviewable PRs (Rule #27).
          image: ghcr.io/sysadminsmedia/homebox@sha256:6506480a3dfadd2cc885fa97b32d11b0ee28ec58629fa34a76afdb4ac540c7fc
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7745
              name: http
          env:
            - name: HBOX_OIDC_ENABLED
              value: "true"
            - name: HBOX_OIDC_ISSUER_URL
              value: "https://auth.srbii.com/realms/homelab"
            - name: HBOX_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: homebox-oauth-secret
                  key: HBOX_OIDC_CLIENT_ID
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homebox-oauth-secret
                  key: HBOX_OIDC_CLIENT_SECRET
            - name: HBOX_OPTIONS_TRUST_PROXY
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homebox-data
