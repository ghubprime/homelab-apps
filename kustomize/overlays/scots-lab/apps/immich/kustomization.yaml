apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - ../../../../base/apps/immich/
  - httproute.yaml
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - immich-cnp.yaml
  # Tier 3B — Velero-independent off-site copy of the photo library.
  # The SealedSecret must stay listed BEFORE the CronJob references it.
  - sealed-rclone-secret.yaml
  - cronjob-gdrive-backup.yaml
helmCharts:
  - name: immich
    repo: https://immich-app.github.io/immich-charts
    version: "0.11.1"
    releaseName: immich
    namespace: immich
    valuesFile: values.yaml
