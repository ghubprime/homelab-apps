apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: it-tools

resources:
  - network-policy.yaml
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - sealed-oauth2-proxy-secret.yaml

configMapGenerator:
  - name: it-tools-nginx-config
    files:
      - default.conf=nginx.conf
