apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Nextcloud
    gethomepage.dev/group: Applications
    gethomepage.dev/description: File Storage
    gethomepage.dev/icon: nextcloud.png
    gethomepage.dev/href: https://files.srbii.com
    gethomepage.dev/weight: '20'
spec:
  parentRefs:
  - name: kgateway-http
    namespace: kgateway-system
    sectionName: http
  hostnames:
  - files.srbii.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nextcloud
      port: 8080
