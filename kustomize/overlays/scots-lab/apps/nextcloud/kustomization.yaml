apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud
resources:
  - ../../../../base/apps/nextcloud/
  - httproute.yaml
  - nextcloud-auth-secret-patch.yaml
  - nextcloud-cnp.yaml
  # Credentials moved out of the chart and into SealedSecrets so no plaintext
  # password is committed. The chart's own Secret rendering is suppressed via
  # the matching existingSecret settings in values-scots-lab.yaml.
  - sealed-nextcloud-admin.yaml
  - sealed-nextcloud-db.yaml
  - sealed-nextcloud-postgresql.yaml
  # Tier 3B — Velero-independent off-site copy of the Nextcloud data volume.
  # The Postgres PVC is deliberately NOT copied; see the CronJob header.
  - sealed-rclone-secret.yaml
  - cronjob-gdrive-backup.yaml
helmCharts:
- name: nextcloud
  repo: https://nextcloud.github.io/helm/
  version: 4.6.11
  releaseName: nextcloud
  namespace: nextcloud
  includeCRDs: true
  valuesFile: ../../../../../helm/overlays/scots-lab/apps/nextcloud/values-scots-lab.yaml
