apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud-isolation-baseline
  namespace: nextcloud
spec:
  # Default-deny ingress with explicit allowlist
  endpointSelector: {}
  ingress:
  # Allow ingress from kGateway (external traffic)
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kgateway-system
  # Allow Prometheus scraping
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-prometheus-system
  # Allow uptime-kuma health checks
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: uptime-kuma

  egress:
  # Allow intra-namespace communication (app <-> postgres, redis)
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: nextcloud
  # Allow DNS resolution
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
  # Allow external egress for app store, OIDC validation, and updates
  - toEntities:
    - world
    - host
  - toCIDR:
    - 0.0.0.0/0
