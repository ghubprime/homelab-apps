# Sealed 2026-08-09 against the LIVE sealed-secrets-controller (Rule #28),
# NOT the cached cluster-auth/kubeseal-cert.crt which was found stale 2026-08-06.
#
# Same rclone.conf as gdrive-backup/rclone-config, re-sealed for this namespace.
# SealedSecrets are strict-scoped: the blob is bound to (namespace, name), so a
# copy cannot simply be moved between namespaces - it has to be re-sealed.
#
# Consumed by cronjob-gdrive-backup.yaml in this same overlay (Tier 3B).
# 2026-10-20: the healthcheck-url-* keys below were sealed against the LIVE
# sealed-secrets-controller (Rule #28), same as rclone.conf. Each entry in
# encryptedData is sealed independently, so adding keys does not disturb the
# existing rclone.conf blob. They are the ping URLs of the matching checks in
# the `healthchecks` app, read by this overlay's CronJob via secretKeyRef.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rclone-config
  namespace: nextcloud
spec:
  encryptedData:
    rclone.conf: 
    healthcheck-url-nextcloud-data: 
  template:
    metadata:
      name: rclone-config
      namespace: nextcloud
    type: Opaque
