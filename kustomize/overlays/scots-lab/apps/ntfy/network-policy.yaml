apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-isolation
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kgateway-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-prometheus-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    # healthchecks sends its down/up notifications here. The ipBlock rules
    # below do not cover it: a Kubernetes ipBlock only ever matches traffic
    # from outside the cluster, never a pod in another namespace.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: healthchecks

    - ipBlock:
        cidr: 192.168.8.0/24
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: fdae::/16
