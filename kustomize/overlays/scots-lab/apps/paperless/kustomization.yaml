apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless
resources:
  - ../../../../base/apps/paperless/
  - httproute.yaml
  - sealed-paperless-oidc.yaml
  - paperless-cnp.yaml
  # Postgres + Redis credentials, moved out of the chart so no plaintext
  # password is committed. Paired with the existingSecret settings in
  # values-scots-lab.yaml, which suppress the subcharts' own Secrets.
  - sealed-paperless-postgresql.yaml
  - sealed-paperless-redis.yaml
  # Tier 3B — Velero-independent off-site copy of media + export.
  # The DB and consume volumes are deliberately NOT copied; see the CronJob header.
  - sealed-rclone-secret.yaml
  - cronjob-gdrive-backup.yaml
helmCharts:
  - name: paperless-ngx
    repo: https://charts.gabe565.com
    version: 0.24.1
    releaseName: paperless
    namespace: paperless
    valuesFile: ../../../../../helm/overlays/scots-lab/apps/paperless/values-scots-lab.yaml
