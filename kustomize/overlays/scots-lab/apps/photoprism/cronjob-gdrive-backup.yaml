                        echo "healthcheck ping delivered (${1:-ok})"
                        return 0
                      fi
                      _try=$((_try + 1))
                      sleep 5
                    done
                    echo "WARNING: healthcheck ping failed 5 times - this run is UNMONITORED"
                    return 0
                  }
                  DATE=$(date +%Y-%m-%d)
                  echo "=== Tier3B photoprism/storage -> GDrive @ $DATE ==="

                  # sync + --backup-dir, NOT `copy` into a dated folder.
                  #
                  # A dated full copy every night means N complete copies after N days. At
                  # the current ~1.2 GiB across these volumes, with the existing 180-day
                  # retention, that is ~200 GiB of Google Drive for data that barely changes
                  # — and it grows linearly as the libraries actually fill up.
                  #
                  # This keeps ONE current mirror plus per-day deltas:
                  #   GDrive:pvc-mirror/<app>/<vol>/           <- always matches the PVC
                  #   GDrive:pvc-snapshots/<app>/<vol>/<date>/ <- only what changed that day
                  #
                  # The archive path stays under pvc-snapshots so the EXISTING
                  # cronjob-retention-cleanup (prunes >180d) ages it out with no change. The
                  # mirror deliberately sits OUTSIDE that prefix, because that retention job
                  # is a blanket `rclone delete --min-age 180d` and would otherwise erode
                  # unchanged files straight out of the live copy.
                  #
                  # --max-delete is the safety valve: if /data ever mounts empty or wrong,
                  # sync would propagate mass deletion into the mirror. Instead it fails
                  # loudly and the healthcheck fires.
                  # --exclude lost+found is REQUIRED, not cosmetic. Every one of these PVCs
                  # is an ext4 RBD volume, so it has a lost+found directory owned by root
                  # with mode 0700. This container runs as UID 1000, so opening it fails
                  # with EACCES; rclone counts that as an IO error and then refuses to
                  # complete the sync at all ("not deleting files as there were IO
                  # errors"), so the WHOLE backup fails. Verified live 2026-08-09 - the
                  # first test run failed with exactly this and nothing was copied.
                  # lost+found is fsck recovery space and is never worth restoring.
                  rclone sync \
                    /data \
                    "GDrive:pvc-mirror/photoprism/storage" \
                    --backup-dir "GDrive:pvc-snapshots/photoprism/storage/$DATE" \
                    --config /tmp/rclone.conf \
                    --exclude "lost+found/**" \
                    --max-delete 500 \
                    --transfers 4 \
                    --checkers 8 \
                    --log-level INFO \
                    --stats 60s \
                    --stats-one-line
                  EXIT_CODE=$?

                  # Rule #30: a backup nobody watches is not a backup. If HEALTHCHECK_URL
                  # is unset the job still succeeds, but says so loudly in the log.
                  if [ $EXIT_CODE -eq 0 ]; then
                    echo "=== photoprism/storage completed OK ==="
                    ping_hc
                  else
                    echo "=== photoprism/storage FAILED (exit $EXIT_CODE) ==="
                    ping_hc /fail
                    exit $EXIT_CODE
                  fi
              env:
                # Populate from the healthchecks app once a check exists for this job.
                # Optional by design: an unset value warns rather than breaking the backup.
                - name: HEALTHCHECK_URL
                  valueFrom:
                    secretKeyRef:
                      name: rclone-config
                      key: healthcheck-url-photoprism-storage
                      optional: true
              volumeMounts:
                - name: rclone-config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: app-data
                  mountPath: /data
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                # PERMISSIONS - why this one job runs as root and the originals job does not
                #   PhotoPrism itself runs as root (Rule #22: s6-overlay images need
                #   runAsUser: 0), so the SQLite dumps it writes are root-owned and mode 0600:
                #     /data/backup/sqlite3/           drwxrwsr-x+  0 0
                #     /data/backup/sqlite3/*.sql      -rw-------+  0 0
                #   Mode 0600 gives group and other nothing, so supplementalGroups cannot help
                #   the way it does for nextcloud - only the owner can read these. Running as
                #   UID 0 reads them by ownership alone, so capabilities stay fully dropped
                #   (adding DAC_READ_SEARCH would be the alternative, and it is both broader
                #   and not on the PSS baseline allow-list this namespace enforces).
                #   Exposure stays narrow: /data is mounted readOnly at the volume level, the
                #   root filesystem is read-only, all capabilities are dropped and privilege
                #   escalation is off. The originals job keeps UID 1000 because photo files
                #   there are world-readable and it has never failed.
                #   Without this rclone gets EACCES on every .sql dump, counts them as IO
                #   errors and aborts the whole sync ("not deleting files as there were IO
                #   errors"), so the database dumps - the only part of this volume that is
                #   not reproducible from originals - were never mirrored. Verified 2026-10-20.
                runAsNonRoot: false
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
          restartPolicy: OnFailure
          volumes:
            - name: rclone-config
              secret:
                secretName: rclone-config
            - name: tmp
              emptyDir: {}
            - name: app-data
              persistentVolumeClaim:
                claimName: photoprism-photoprism-storage
                readOnly: true
