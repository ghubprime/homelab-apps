apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  name: gdrive-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: r2-mirror
    app.kubernetes.io/name: gdrive-backup
  name: gdrive-r2-mirror
  namespace: gdrive-backup
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: r2-mirror
            app.kubernetes.io/name: gdrive-backup
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              echo "=== GDrive R2 Mirror: $(date -Iseconds) ==="
              echo "Copying R2 bucket to Google Drive..."

              rclone copy \
                R2:homelab-velero-backups \
                GDrive:velero-mirror \
                --config /config/rclone.conf \
                --transfers 4 \
                --checkers 8 \
                --log-level INFO \
                --stats 60s \
                --stats-one-line

              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 0 ]; then
                echo "=== Mirror sync completed successfully ==="
                # Ping healthcheck on success (uncomment when configured)
                # curl -fsS -m 10 --retry 5 https://ping.srbii.com/api/v1/ping/<UUID> > /dev/null
              else
                echo "=== Mirror sync FAILED with exit code $EXIT_CODE ==="
                # Ping healthcheck failure endpoint (uncomment when configured)
                # curl -fsS -m 10 --retry 5 https://ping.srbii.com/api/v1/ping/<UUID>/fail > /dev/null
                exit $EXIT_CODE
              fi
            command:
            - /bin/sh
            - -c
            image: rclone/rclone:1.69
            name: rclone
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /config
              name: rclone-config
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
  schedule: 0 3 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: retention-cleanup
    app.kubernetes.io/name: gdrive-backup
  name: gdrive-retention-cleanup
  namespace: gdrive-backup
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: retention-cleanup
            app.kubernetes.io/name: gdrive-backup
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              echo "=== GDrive Retention Cleanup: $(date -Iseconds) ==="

              echo "--- Pruning velero-mirror (>365 days) ---"
              rclone delete \
                GDrive:velero-mirror \
                --config /config/rclone.conf \
                --min-age 365d \
                --log-level INFO \
                --stats-one-line \
                --rmdirs
              echo "Velero mirror pruning complete."

              echo "--- Pruning pvc-snapshots (>180 days) ---"
              rclone delete \
                GDrive:pvc-snapshots \
                --config /config/rclone.conf \
                --min-age 180d \
                --log-level INFO \
                --stats-one-line \
                --rmdirs
              echo "PVC snapshots pruning complete."

              echo "--- Drive usage summary ---"
              rclone size GDrive:velero-mirror --config /config/rclone.conf --json 2>/dev/null | \
                (cat; echo) | head -1
              rclone size GDrive:pvc-snapshots --config /config/rclone.conf --json 2>/dev/null | \
                (cat; echo) | head -1

              echo "=== Retention cleanup complete ==="
            command:
            - /bin/sh
            - -c
            image: rclone/rclone:1.69
            name: rclone
            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /config
              name: rclone-config
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
  schedule: 0 4 1 * *
  successfulJobsHistoryLimit: 3
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rclone-config
  namespace: gdrive-backup
spec:
  encryptedData:
    rclone.conf: 
  template:
    metadata:
      name: rclone-config
      namespace: gdrive-backup
