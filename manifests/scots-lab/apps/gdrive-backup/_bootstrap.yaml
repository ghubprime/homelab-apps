apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  name: gdrive-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: r2-mirror
    app.kubernetes.io/name: gdrive-backup
  name: gdrive-r2-mirror
  namespace: gdrive-backup
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: r2-mirror
            app.kubernetes.io/name: gdrive-backup
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              cp /config/rclone.conf /tmp/rclone.conf

              # The rclone image is Alpine with busybox wget and NO curl, so the
              # original `curl -fsS --retry 5` ping could never have fired: it exited 127
              # and the trailing `|| true` swallowed it. Verified in-image 2026-10-20.
              # busybox wget has no retry flag, hence the loop. A ping that cannot be
              # delivered must never change the job's own exit status.
              ping_hc() {
                if [ -z "${HEALTHCHECK_URL:-}" ]; then
                  echo "WARNING: HEALTHCHECK_URL unset - this backup is UNMONITORED"
                  return 0
                fi
                _try=1
                while [ "$_try" -le 5 ]; do
                  if wget -q -T 10 -O /dev/null "${HEALTHCHECK_URL}${1:-}"; then
                    echo "healthcheck ping delivered (${1:-ok})"
                    return 0
                  fi
                  _try=$((_try + 1))
                  sleep 5
                done
                echo "WARNING: healthcheck ping failed 5 times - this run is UNMONITORED"
                return 0
              }
              echo "=== GDrive R2 Mirror: $(date -Iseconds) ==="
              echo "Copying R2 bucket to Google Drive..."

              rclone copy \
                R2:homelab-velero-backups \
                GDrive:velero-mirror \
                --config /tmp/rclone.conf \
                --transfers 4 \
                --checkers 8 \
                --log-level INFO \
                --stats 60s \
                --stats-one-line

              EXIT_CODE=$?
              # Rule #30 applies to this job as much as to anything in the cluster:
              # both healthcheck pings used to be commented out, so a failure of the ONLY
              # second off-site copy would have been completely silent. Now driven by an
              # optional Secret key — unset warns loudly rather than failing the backup.
              if [ $EXIT_CODE -eq 0 ]; then
                echo "=== Mirror sync completed successfully ==="
                ping_hc
              else
                echo "=== Mirror sync FAILED with exit code $EXIT_CODE ==="
                ping_hc /fail
                exit $EXIT_CODE
              fi
            command:
            - /bin/sh
            - -c
            env:
            - name: HEALTHCHECK_URL
              valueFrom:
                secretKeyRef:
                  key: healthcheck-url-r2-mirror
                  name: rclone-config
                  optional: true
            image: rclone/rclone:1.69
            name: rclone
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /config
              name: rclone-config
              readOnly: true
            - mountPath: /tmp
              name: tmp
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - emptyDir: {}
            name: tmp
  schedule: 0 6 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: retention-cleanup
    app.kubernetes.io/name: gdrive-backup
  name: gdrive-retention-cleanup
  namespace: gdrive-backup
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: retention-cleanup
            app.kubernetes.io/name: gdrive-backup
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              set -u
              cp /config/rclone.conf /tmp/rclone.conf

              # The rclone image is Alpine with busybox wget and NO curl, so a
              # `curl` ping would exit 127. busybox wget has no retry flag, hence the
              # loop. A ping that cannot be delivered must never change the job's exit.
              ping_hc() {
                if [ -z "${HEALTHCHECK_URL:-}" ]; then
                  echo "WARNING: HEALTHCHECK_URL unset - this cleanup is UNMONITORED"
                  return 0
                fi
                _try=1
                while [ "$_try" -le 5 ]; do
                  if wget -q -T 10 -O /dev/null "${HEALTHCHECK_URL}${1:-}"; then
                    echo "healthcheck ping delivered (${1:-ok})"
                    return 0
                  fi
                  _try=$((_try + 1))
                  sleep 5
                done
                echo "WARNING: healthcheck ping failed 5 times - this run is UNMONITORED"
                return 0
              }

              echo "=== GDrive Retention Cleanup: $(date -Iseconds) ==="

              # Both prunes always run; EXIT_CODE keeps the first failure so a partial
              # cleanup still reports /fail rather than a misleading success.
              EXIT_CODE=0

              echo "--- Pruning velero-mirror (>365 days) ---"
              rclone delete \
                GDrive:velero-mirror \
                --config /tmp/rclone.conf \
                --min-age 365d \
                --log-level INFO \
                --stats-one-line \
                --rmdirs || EXIT_CODE=$?
              echo "Velero mirror pruning complete."

              echo "--- Pruning pvc-snapshots (>180 days) ---"
              rclone delete \
                GDrive:pvc-snapshots \
                --config /tmp/rclone.conf \
                --min-age 180d \
                --log-level INFO \
                --stats-one-line \
                --rmdirs || EXIT_CODE=$?
              echo "PVC snapshots pruning complete."

              echo "--- Drive usage summary ---"
              rclone size GDrive:velero-mirror --config /tmp/rclone.conf --json 2>/dev/null | \
                (cat; echo) | head -1
              rclone size GDrive:pvc-snapshots --config /tmp/rclone.conf --json 2>/dev/null | \
                (cat; echo) | head -1

              # Rule #30: a cleanup nobody watches is not a cleanup. This job runs monthly,
              # so a silent failure would go unnoticed for a month at a time.
              if [ $EXIT_CODE -eq 0 ]; then
                echo "=== Retention cleanup complete ==="
                ping_hc
              else
                echo "=== Retention cleanup FAILED (exit $EXIT_CODE) ==="
                ping_hc /fail
                exit $EXIT_CODE
              fi
            command:
            - /bin/sh
            - -c
            env:
            - name: HEALTHCHECK_URL
              valueFrom:
                secretKeyRef:
                  key: healthcheck-url-retention-cleanup
                  name: rclone-config
                  optional: true
            image: rclone/rclone:1.69
            name: rclone
            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /config
              name: rclone-config
              readOnly: true
            - mountPath: /tmp
              name: tmp
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - emptyDir: {}
            name: tmp
  schedule: 0 7 1 * *
  successfulJobsHistoryLimit: 3
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rclone-config
  namespace: gdrive-backup
spec:
  encryptedData:
    healthcheck-url-r2-mirror: 
    healthcheck-url-retention-cleanup: 
    rclone.conf: 
  template:
    metadata:
      name: rclone-config
      namespace: gdrive-backup
