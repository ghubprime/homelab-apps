kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  ports:
  - name: proxy
    port: 4180
    targetPort: 4180
  selector:
    app: homepage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homepage
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
      - env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: home.srbii.com
        image: ghcr.io/gethomepage/homepage:v1.12.3
        imagePullPolicy: IfNotPresent
        name: homepage
        ports:
        - containerPort: 3000
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /app/config
          name: config
      - args:
        - --provider=oidc
        - --oidc-issuer-url=https://auth.srbii.com/realms/homelab
        - --upstream=http://127.0.0.1:3000
        - --http-address=0.0.0.0:4180
        - --email-domain=*
        - --pass-user-headers=false
        - --cookie-secure=true
        - --cookie-name=_oauth2_homepage
        - --cookie-domain=home.srbii.com
        - --redirect-url=https://home.srbii.com/oauth2/callback
        - --whitelist-domain=.srbii.com
        - --skip-provider-button=true
        - --session-cookie-minimal=true
        envFrom:
        - secretRef:
            name: oauth2-proxy-secret
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        name: oauth2-proxy
        ports:
        - containerPort: 4180
          name: proxy
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      initContainers:
      - command:
        - sh
        - -c
        - cp /configmap-data/* /app-config/
        image: busybox:1.36
        name: copy-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /app-config
          name: config
        - mountPath: /configmap-data
          name: configmap-data
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: homepage
      volumes:
      - emptyDir: {}
        name: config
      - configMap:
          name: homepage-config
        name: configmap-data
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oauth2-proxy-secret
  namespace: homepage
spec:
  encryptedData:
    OAUTH2_PROXY_CLIENT_ID: 
    OAUTH2_PROXY_CLIENT_SECRET: 
    OAUTH2_PROXY_COOKIE_SECRET: 
  template:
    metadata:
      name: oauth2-proxy-secret
      namespace: homepage
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  hostnames:
  - home.srbii.com
  parentRefs:
  - name: kgateway-http
    namespace: kgateway-system
  rules:
  - backendRefs:
    - name: homepage
      port: 4180
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-isolation
  namespace: homepage
spec:
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kgateway-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-prometheus-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
    - ipBlock:
        cidr: 192.168.8.0/24
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: fdae::/16
  podSelector: {}
  policyTypes:
  - Ingress
