apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
  name: immich
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/service: immich-machine-learning
    app.kubernetes.io/version: v2.6.3
    helm.sh/chart: immich-0.11.1
  name: immich-machine-learning
  namespace: immich
spec:
  ports:
  - name: http
    port: 3003
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: machine-learning
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  ports:
  - port: 5432
  selector:
    app: immich-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis-master
  namespace: immich
spec:
  ports:
  - port: 6379
  selector:
    app: immich-redis
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: server
    app.kubernetes.io/service: immich-server
    app.kubernetes.io/version: v2.6.3
    helm.sh/chart: immich-0.11.1
  name: immich-server
  namespace: immich
spec:
  ports:
  - appProtocol: kubernetes.io/ws
    name: http
    port: 2283
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: server
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  namespace: immich
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: ceph-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-pvc
  namespace: immich
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-block
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/version: v2.6.3
    helm.sh/chart: immich-0.11.1
  name: immich-machine-learning
  namespace: immich
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: machine-learning
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: machine-learning
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: DB_DATABASE_NAME
          value: immich
        - name: DB_HOSTNAME
          value: immich-postgres
        - name: DB_PASSWORD
          value: immich
        - name: DB_URL
          value: postgresql://immich:immich@immich-postgres:5432/immich?sslmode=disable
        - name: DB_USERNAME
          value: immich
        - name: HF_XET_CACHE
          value: /cache/huggingface-xet
        - name: IMMICH_IGNORE_MOUNT_CHECK_ERRORS
          value: "true"
        - name: IMMICH_MACHINE_LEARNING_URL
          value: http://immich-machine-learning:3003
        - name: MPLCONFIGDIR
          value: /cache/matplotlib-config
        - name: REDIS_HOSTNAME
          value: immich-redis-master
        - name: TRANSFORMERS_CACHE
          value: /cache
        image: ghcr.io/immich-app/immich-machine-learning:v2.6.3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
        name: main
        ports:
        - containerPort: 3003
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /cache
          name: cache
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      priorityClassName: homelab-data
      serviceAccountName: default
      volumes:
      - emptyDir: {}
        name: cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis-master
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
      - image: docker.io/redis:7-alpine
        name: redis
        ports:
        - containerPort: 6379
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
      priorityClassName: homelab-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: server
    app.kubernetes.io/version: v2.6.3
    helm.sh/chart: immich-0.11.1
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: server
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: DB_DATABASE_NAME
          value: immich
        - name: DB_HOSTNAME
          value: immich-postgres
        - name: DB_PASSWORD
          value: immich
        - name: DB_URL
          value: postgresql://immich:immich@immich-postgres:5432/immich?sslmode=disable
        - name: DB_USERNAME
          value: immich
        - name: IMMICH_IGNORE_MOUNT_CHECK_ERRORS
          value: "true"
        - name: IMMICH_MACHINE_LEARNING_URL
          value: http://immich-machine-learning:3003
        - name: REDIS_HOSTNAME
          value: immich-redis-master
        image: ghcr.io/immich-app/immich-server:v2.6.3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/server/ping
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
        name: main
        ports:
        - containerPort: 2283
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/server/ping
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /api/server/ping
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /data
          name: data
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      priorityClassName: homelab-data
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: immich-library-pvc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  serviceName: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          value: immich
        - name: POSTGRES_USER
          value: immich
        - name: POSTGRES_DB
          value: immich
        - name: POSTGRES_INITDB_ARGS
          value: --data-checksums
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
        name: postgres
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
      priorityClassName: homelab-data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: immich-postgres-pvc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: pvc-backup
    app.kubernetes.io/name: gdrive-backup
    app.kubernetes.io/part-of: immich
  name: gdrive-pvc-backup-immich-library
  namespace: immich
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: pvc-backup
            app.kubernetes.io/name: gdrive-backup
            app.kubernetes.io/part-of: immich
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: immich
                    app.kubernetes.io/name: server
                topologyKey: kubernetes.io/hostname
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              set -u
              cp /config/rclone.conf /tmp/rclone.conf
              DATE=$(date +%Y-%m-%d)
              echo "=== Tier3B immich/library -> GDrive @ $DATE ==="

              # sync + --backup-dir, NOT `copy` into a dated folder.
              #
              # A dated full copy every night means N complete copies after N days. At
              # the current ~1.2 GiB across these volumes, with the existing 180-day
              # retention, that is ~200 GiB of Google Drive for data that barely changes
              # — and it grows linearly as the libraries actually fill up.
              #
              # This keeps ONE current mirror plus per-day deltas:
              #   GDrive:pvc-mirror/<app>/<vol>/           <- always matches the PVC
              #   GDrive:pvc-snapshots/<app>/<vol>/<date>/ <- only what changed that day
              #
              # The archive path stays under pvc-snapshots so the EXISTING
              # cronjob-retention-cleanup (prunes >180d) ages it out with no change. The
              # mirror deliberately sits OUTSIDE that prefix, because that retention job
              # is a blanket `rclone delete --min-age 180d` and would otherwise erode
              # unchanged files straight out of the live copy.
              #
              # --max-delete is the safety valve: if /data ever mounts empty or wrong,
              # sync would propagate mass deletion into the mirror. Instead it fails
              # loudly and the healthcheck fires.
              rclone sync \
                /data \
                "GDrive:pvc-mirror/immich/library" \
                --backup-dir "GDrive:pvc-snapshots/immich/library/$DATE" \
                --config /tmp/rclone.conf \
                --max-delete 500 \
                --transfers 4 \
                --checkers 8 \
                --log-level INFO \
                --stats 60s \
                --stats-one-line
              EXIT_CODE=$?

              # Rule #30: a backup nobody watches is not a backup. If HEALTHCHECK_URL
              # is unset the job still succeeds, but says so loudly in the log.
              if [ $EXIT_CODE -eq 0 ]; then
                echo "=== immich/library completed OK ==="
                if [ -n "${HEALTHCHECK_URL:-}" ]; then
                  curl -fsS -m 10 --retry 5 "$HEALTHCHECK_URL" > /dev/null || true
                else
                  echo "WARNING: HEALTHCHECK_URL unset - this backup is UNMONITORED"
                fi
              else
                echo "=== immich/library FAILED (exit $EXIT_CODE) ==="
                if [ -n "${HEALTHCHECK_URL:-}" ]; then
                  curl -fsS -m 10 --retry 5 "$HEALTHCHECK_URL/fail" > /dev/null || true
                fi
                exit $EXIT_CODE
              fi
            command:
            - /bin/sh
            - -c
            env:
            - name: HEALTHCHECK_URL
              valueFrom:
                secretKeyRef:
                  key: healthcheck-url-immich-library
                  name: rclone-config
                  optional: true
            image: rclone/rclone:1.69
            name: rclone
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /config
              name: rclone-config
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /data
              name: app-data
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - emptyDir: {}
            name: tmp
          - name: app-data
            persistentVolumeClaim:
              claimName: immich-library-pvc
              readOnly: true
  schedule: 10 3 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rclone-config
  namespace: immich
spec:
  encryptedData:
    rclone.conf: 
  template:
    metadata:
      name: rclone-config
      namespace: immich
    type: Opaque
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-isolation-baseline
  namespace: immich
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: immich
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
  - toEntities:
    - world
    - host
  - toCIDR:
    - 0.0.0.0/0
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kgateway-system
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-prometheus-system
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: uptime-kuma
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Photo & Video Backup
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://media.srbii.com
    gethomepage.dev/icon: immich.png
    gethomepage.dev/name: Immich
    gethomepage.dev/weight: "28"
  name: immich
  namespace: immich
spec:
  hostnames:
  - media.srbii.com
  parentRefs:
  - name: kgateway-http
    namespace: kgateway-system
  rules:
  - backendRefs:
    - name: immich-server
      port: 2283
    filters:
    - requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
      type: RequestHeaderModifier
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-isolation
  namespace: immich
spec:
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kgateway-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-prometheus-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
  podSelector: {}
  policyTypes:
  - Ingress
