apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: 15.4.0
    helm.sh/chart: postgresql-12.12.10
  name: nextcloud-postgresql
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: primary
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/name: postgresql
  serviceName: nextcloud-postgresql-hl
  template:
    metadata:
      labels:
        app.kubernetes.io/component: primary
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/version: 15.4.0
        helm.sh/chart: postgresql-12.12.10
      name: nextcloud-postgresql
    spec:
      affinity:
        nodeAffinity: null
        podAffinity: null
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: primary
                  app.kubernetes.io/instance: nextcloud
                  app.kubernetes.io/name: postgresql
              topologyKey: kubernetes.io/hostname
            weight: 1
      containers:
      - env:
        - name: BITNAMI_DEBUG
          value: "false"
        - name: POSTGRESQL_PORT_NUMBER
          value: "5432"
        - name: POSTGRESQL_VOLUME_DIR
          value: /bitnami/postgresql
        - name: PGDATA
          value: /bitnami/postgresql/data
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: nextcloud-postgresql-creds
        - name: POSTGRES_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: nextcloud-postgresql-creds
        - name: POSTGRES_DATABASE
          value: nextcloud
        - name: POSTGRESQL_ENABLE_LDAP
          value: "no"
        - name: POSTGRESQL_ENABLE_TLS
          value: "no"
        - name: POSTGRESQL_LOG_HOSTNAME
          value: "false"
        - name: POSTGRESQL_LOG_CONNECTIONS
          value: "false"
        - name: POSTGRESQL_LOG_DISCONNECTIONS
          value: "false"
        - name: POSTGRESQL_PGAUDIT_LOG_CATALOG
          value: "off"
        - name: POSTGRESQL_CLIENT_MIN_MESSAGES
          value: error
        - name: POSTGRESQL_SHARED_PRELOAD_LIBRARIES
          value: pgaudit
        image: docker.io/bitnamilegacy/postgresql:15.4.0-debian-11-r45
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "nextcloud" -d "dbname=nextcloud" -h 127.0.0.1 -p
              5432
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: postgresql
        ports:
        - containerPort: 5432
          name: tcp-postgresql
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - -e
            - |
              exec pg_isready -U "nextcloud" -d "dbname=nextcloud" -h 127.0.0.1 -p 5432
          failureThreshold: 6
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits: {}
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 1001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /bitnami/postgresql
          name: data
      hostIPC: false
      hostNetwork: false
      securityContext:
        fsGroup: 1001
      serviceAccountName: default
      volumes:
      - emptyDir:
          medium: Memory
        name: dshm
  updateStrategy:
    rollingUpdate: {}
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: ceph-block
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: pvc-backup
    app.kubernetes.io/name: gdrive-backup
    app.kubernetes.io/part-of: nextcloud
  name: gdrive-pvc-backup-nextcloud-data
  namespace: nextcloud
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: pvc-backup
            app.kubernetes.io/name: gdrive-backup
            app.kubernetes.io/part-of: nextcloud
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: app
                    app.kubernetes.io/instance: nextcloud
                    app.kubernetes.io/name: nextcloud
                topologyKey: kubernetes.io/hostname
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              set -u
              cp /config/rclone.conf /tmp/rclone.conf
              DATE=$(date +%Y-%m-%d)
              echo "=== Tier3B nextcloud/data -> GDrive @ $DATE ==="

              # sync + --backup-dir, NOT `copy` into a dated folder.
              #
              # A dated full copy every night means N complete copies after N days. At
              # the current ~1.2 GiB across these volumes, with the existing 180-day
              # retention, that is ~200 GiB of Google Drive for data that barely changes
              # — and it grows linearly as the libraries actually fill up.
              #
              # This keeps ONE current mirror plus per-day deltas:
              #   GDrive:pvc-mirror/<app>/<vol>/           <- always matches the PVC
              #   GDrive:pvc-snapshots/<app>/<vol>/<date>/ <- only what changed that day
              #
              # The archive path stays under pvc-snapshots so the EXISTING
              # cronjob-retention-cleanup (prunes >180d) ages it out with no change. The
              # mirror deliberately sits OUTSIDE that prefix, because that retention job
              # is a blanket `rclone delete --min-age 180d` and would otherwise erode
              # unchanged files straight out of the live copy.
              #
              # --max-delete is the safety valve: if /data ever mounts empty or wrong,
              # sync would propagate mass deletion into the mirror. Instead it fails
              # loudly and the healthcheck fires.
              # --exclude lost+found is REQUIRED, not cosmetic. Every one of these PVCs
              # is an ext4 RBD volume, so it has a lost+found directory owned by root
              # with mode 0700. This container runs as UID 1000, so opening it fails
              # with EACCES; rclone counts that as an IO error and then refuses to
              # complete the sync at all ("not deleting files as there were IO
              # errors"), so the WHOLE backup fails. Verified live 2026-08-09 - the
              # first test run failed with exactly this and nothing was copied.
              # lost+found is fsck recovery space and is never worth restoring.
              rclone sync \
                /data \
                "GDrive:pvc-mirror/nextcloud/data" \
                --backup-dir "GDrive:pvc-snapshots/nextcloud/data/$DATE" \
                --config /tmp/rclone.conf \
                --exclude "lost+found/**" \
                --max-delete 500 \
                --transfers 4 \
                --checkers 8 \
                --log-level INFO \
                --stats 60s \
                --stats-one-line
              EXIT_CODE=$?

              # Rule #30: a backup nobody watches is not a backup. If HEALTHCHECK_URL
              # is unset the job still succeeds, but says so loudly in the log.
              if [ $EXIT_CODE -eq 0 ]; then
                echo "=== nextcloud/data completed OK ==="
                if [ -n "${HEALTHCHECK_URL:-}" ]; then
                  curl -fsS -m 10 --retry 5 "$HEALTHCHECK_URL" > /dev/null || true
                else
                  echo "WARNING: HEALTHCHECK_URL unset - this backup is UNMONITORED"
                fi
              else
                echo "=== nextcloud/data FAILED (exit $EXIT_CODE) ==="
                if [ -n "${HEALTHCHECK_URL:-}" ]; then
                  curl -fsS -m 10 --retry 5 "$HEALTHCHECK_URL/fail" > /dev/null || true
                fi
                exit $EXIT_CODE
              fi
            command:
            - /bin/sh
            - -c
            env:
            - name: HEALTHCHECK_URL
              valueFrom:
                secretKeyRef:
                  key: healthcheck-url-nextcloud-data
                  name: rclone-config
                  optional: true
            image: rclone/rclone:1.69
            name: rclone
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /config
              name: rclone-config
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /data
              name: app-data
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - emptyDir: {}
            name: tmp
          - name: app-data
            persistentVolumeClaim:
              claimName: nextcloud-nextcloud
              readOnly: true
  schedule: 40 4 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
---
