---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud-isolation-baseline
  namespace: nextcloud
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: nextcloud
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
  - toEntities:
    - world
    - host
  - toCIDR:
    - 0.0.0.0/0
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kgateway-system
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-prometheus-system
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: uptime-kuma
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: File Storage
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://files.srbii.com
    gethomepage.dev/icon: nextcloud.png
    gethomepage.dev/name: Nextcloud
    gethomepage.dev/weight: "20"
  name: nextcloud
  namespace: nextcloud
spec:
  hostnames:
  - files.srbii.com
  parentRefs:
  - name: kgateway-http
    namespace: kgateway-system
    sectionName: http
  rules:
  - backendRefs:
    - name: nextcloud
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-isolation
  namespace: nextcloud
spec:
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kgateway-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-prometheus-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare
  podSelector: {}
  policyTypes:
  - Ingress
