apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  name: onetimesecret
---
apiVersion: v1
kind: Service
metadata:
  name: onetimesecret
  namespace: onetimesecret
spec:
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  selector:
    app: onetimesecret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onetimesecret-redis-data
  namespace: onetimesecret
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: onetimesecret
  name: onetimesecret
  namespace: onetimesecret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onetimesecret
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: onetimesecret
    spec:
      containers:
      - env:
        - name: REDIS_URL
          value: redis://127.0.0.1:6379/0
        - name: HOST
          value: expires.srbii.com
        - name: SSL
          value: "true"
        - name: RACK_ENV
          value: production
        - name: AUTH_REQUIRED
          value: "false"
        envFrom:
        - secretRef:
            name: onetimesecret-secret
        image: onetimesecret/onetimesecret:v0.24.7
        name: onetimesecret
        ports:
        - containerPort: 3000
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
      - command:
        - redis-server
        - --appendonly
        - "yes"
        image: redis:7-bookworm
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
        - mountPath: /data
          name: redis-data
      priorityClassName: homelab-data
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: onetimesecret-redis-data
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: onetimesecret-secret
  namespace: onetimesecret
spec:
  encryptedData:
    SECRET: 
  template:
    metadata:
      name: onetimesecret-secret
      namespace: onetimesecret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Secure Secret Sharing
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Monitoring
    gethomepage.dev/href: https://expires.srbii.com
    gethomepage.dev/icon: mdi-lock-clock
    gethomepage.dev/name: OneTimeSecret
    gethomepage.dev/weight: "52"
  name: onetimesecret
  namespace: onetimesecret
spec:
  hostnames:
  - expires.srbii.com
  parentRefs:
  - name: kgateway-http
    namespace: kgateway-system
  rules:
  - backendRefs:
    - name: onetimesecret
      port: 3000
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-isolation
  namespace: onetimesecret
spec:
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kgateway-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-prometheus-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
    - ipBlock:
        cidr: 192.168.8.0/24
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: fdae::/16
  podSelector: {}
  policyTypes:
  - Ingress
