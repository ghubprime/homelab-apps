apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
  name: photoprism
---
apiVersion: v1
kind: Secret
metadata:
  name: photoprism-photoprism-secrets
  namespace: photoprism
stringData:
  PHOTOPRISM_ADMIN_PASSWORD: unused-managed-via-sealedsecret
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: photoprism
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: photoprism
    helm.sh/chart: photoprism-plus-1.0.4
  name: photoprism-photoprism
  namespace: photoprism
spec:
  ports:
  - name: http
    port: 2342
    targetPort: 2342
  selector:
    app.kubernetes.io/instance: photoprism
    app.kubernetes.io/name: photoprism
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: photoprism
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: photoprism
    helm.sh/chart: photoprism-plus-1.0.4
  name: photoprism-photoprism-originals
  namespace: photoprism
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: photoprism
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: photoprism
    helm.sh/chart: photoprism-plus-1.0.4
  name: photoprism-photoprism-storage
  namespace: photoprism
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-block
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: photoprism
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: photoprism
    helm.sh/chart: photoprism-plus-1.0.4
  name: photoprism-photoprism
  namespace: photoprism
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: photoprism
      app.kubernetes.io/name: photoprism
  serviceName: photoprism-photoprism
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: photoprism
        app.kubernetes.io/name: photoprism
    spec:
      containers:
      - env:
        - name: PHOTOPRISM_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PHOTOPRISM_ADMIN_PASSWORD
              name: photoprism-admin-creds
        - name: PHOTOPRISM_SITE_URL
          value: https://photos.srbii.com/
        - name: PHOTOPRISM_ADMIN_USER
          value: admin
        - name: PHOTOPRISM_DATABASE_DRIVER
          value: sqlite
        - name: PHOTOPRISM_DATABASE_NAME
          value: photoprism
        - name: PHOTOPRISM_DATABASE_USER
          value: photoprism
        - name: PHOTOPRISM_DATABASE_TIMEOUT
          value: "15"
        - name: PHOTOPRISM_DATABASE_CONNS
          value: "0"
        - name: PHOTOPRISM_DATABASE_CONNS_IDLE
          value: "0"
        - name: PHOTOPRISM_DISABLE_OIDC
          value: "false"
        - name: PHOTOPRISM_OIDC_CLIENT
          value: photoprism-client
        - name: PHOTOPRISM_OIDC_PROVIDER
          value: Keycloak
        - name: PHOTOPRISM_OIDC_REDIRECT
          value: "false"
        - name: PHOTOPRISM_OIDC_REGISTER
          value: "true"
        - name: PHOTOPRISM_OIDC_SCOPES
          value: openid email profile
        - name: PHOTOPRISM_OIDC_URI
          value: https://auth.srbii.com/realms/homelab
        - name: PHOTOPRISM_OIDC_USERNAME
          value: preferred_username
        - name: PHOTOPRISM_OIDC_WEBDAV
          value: "false"
        - name: PHOTOPRISM_APP_COLOR
          value: '#1d1d1e'
        - name: PHOTOPRISM_APP_NAME
          value: PhotoPrism
        - name: PHOTOPRISM_AUTH_MODE
          value: password
        - name: PHOTOPRISM_BACKUP_ALBUMS
          value: "true"
        - name: PHOTOPRISM_BACKUP_DATABASE
          value: "true"
        - name: PHOTOPRISM_BACKUP_RETAIN
          value: "3"
        - name: PHOTOPRISM_BACKUP_SCHEDULE
          value: daily
        - name: PHOTOPRISM_CORS_HEADERS
          value: Accept, Accept-Ranges, Content-Disposition, Content-Encoding, Content-Range,
            Location
        - name: PHOTOPRISM_CORS_METHODS
          value: GET, HEAD, OPTIONS
        - name: PHOTOPRISM_DEFAULT_LOCALE
          value: en
        - name: PHOTOPRISM_DISABLE_STS
          value: "true"
        - name: PHOTOPRISM_DISABLE_TLS
          value: "true"
        - name: PHOTOPRISM_FILES_QUOTA
          value: "0"
        - name: PHOTOPRISM_HTTP_COMPRESSION
          value: gzip
        - name: PHOTOPRISM_IMPORT_ALLOW
          value: zip,jpeg,jpg,png,gif,bmp,avif,webp,heic,heif,tiff,pdf,ai,svg,xmp
        - name: PHOTOPRISM_LOG_LEVEL
          value: info
        - name: PHOTOPRISM_ORIGINALS_LIMIT
          value: "50000"
        - name: PHOTOPRISM_PASSWORD_LENGTH
          value: "8"
        - name: PHOTOPRISM_PLACES_LOCALE
          value: local
        - name: PHOTOPRISM_SESSION_CACHE
          value: "900"
        - name: PHOTOPRISM_SESSION_MAXAGE
          value: "1209600"
        - name: PHOTOPRISM_SESSION_TIMEOUT
          value: "604800"
        - name: PHOTOPRISM_SITE_CAPTION
          value: AI-Powered Photos
        - name: PHOTOPRISM_SITE_TITLE
          value: Photos
        - name: PHOTOPRISM_UPLOAD_ALLOW
          value: zip,jpeg,jpg,png,gif,bmp,avif,webp,heic,heif,tiff,pdf,ai,svg,xmp
        - name: PHOTOPRISM_UPLOAD_ARCHIVES
          value: "true"
        - name: PHOTOPRISM_UPLOAD_LIMIT
          value: "5000"
        - name: PHOTOPRISM_UPLOAD_NSFW
          value: "true"
        envFrom:
        - secretRef:
            name: photoprism-oidc-secret
        image: docker.io/photoprism/photoprism:ce
        imagePullPolicy: IfNotPresent
        name: photoprism-plus
        ports:
        - containerPort: 2342
          name: http
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /photoprism/originals
          name: originals
        - mountPath: /photoprism/storage
          name: storage
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      volumes:
      - name: originals
        persistentVolumeClaim:
          claimName: photoprism-photoprism-originals
      - name: storage
        persistentVolumeClaim:
          claimName: photoprism-photoprism-storage
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: pvc-backup
    app.kubernetes.io/name: gdrive-backup
    app.kubernetes.io/part-of: photoprism
  name: gdrive-pvc-backup-photoprism-originals
  namespace: photoprism
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: pvc-backup
            app.kubernetes.io/name: gdrive-backup
            app.kubernetes.io/part-of: photoprism
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: photoprism
                    app.kubernetes.io/name: photoprism
                topologyKey: kubernetes.io/hostname
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              set -u
              cp /config/rclone.conf /tmp/rclone.conf
              DATE=$(date +%Y-%m-%d)
              echo "=== Tier3B photoprism/originals -> GDrive @ $DATE ==="

              # sync + --backup-dir, NOT `copy` into a dated folder.
              #
              # A dated full copy every night means N complete copies after N days. At
              # the current ~1.2 GiB across these volumes, with the existing 180-day
              # retention, that is ~200 GiB of Google Drive for data that barely changes
              # — and it grows linearly as the libraries actually fill up.
              #
              # This keeps ONE current mirror plus per-day deltas:
              #   GDrive:pvc-mirror/<app>/<vol>/           <- always matches the PVC
              #   GDrive:pvc-snapshots/<app>/<vol>/<date>/ <- only what changed that day
              #
              # The archive path stays under pvc-snapshots so the EXISTING
              # cronjob-retention-cleanup (prunes >180d) ages it out with no change. The
              # mirror deliberately sits OUTSIDE that prefix, because that retention job
              # is a blanket `rclone delete --min-age 180d` and would otherwise erode
              # unchanged files straight out of the live copy.
              #
              # --max-delete is the safety valve: if /data ever mounts empty or wrong,
              # sync would propagate mass deletion into the mirror. Instead it fails
              # loudly and the healthcheck fires.
              rclone sync \
                /data \
                "GDrive:pvc-mirror/photoprism/originals" \
                --backup-dir "GDrive:pvc-snapshots/photoprism/originals/$DATE" \
                --config /tmp/rclone.conf \
                --max-delete 500 \
                --transfers 4 \
                --checkers 8 \
                --log-level INFO \
                --stats 60s \
                --stats-one-line
              EXIT_CODE=$?

              # Rule #30: a backup nobody watches is not a backup. If HEALTHCHECK_URL
              # is unset the job still succeeds, but says so loudly in the log.
              if [ $EXIT_CODE -eq 0 ]; then
                echo "=== photoprism/originals completed OK ==="
                if [ -n "${HEALTHCHECK_URL:-}" ]; then
                  curl -fsS -m 10 --retry 5 "$HEALTHCHECK_URL" > /dev/null || true
                else
                  echo "WARNING: HEALTHCHECK_URL unset - this backup is UNMONITORED"
                fi
              else
                echo "=== photoprism/originals FAILED (exit $EXIT_CODE) ==="
                if [ -n "${HEALTHCHECK_URL:-}" ]; then
                  curl -fsS -m 10 --retry 5 "$HEALTHCHECK_URL/fail" > /dev/null || true
                fi
                exit $EXIT_CODE
              fi
            command:
            - /bin/sh
            - -c
            env:
            - name: HEALTHCHECK_URL
              valueFrom:
                secretKeyRef:
                  key: healthcheck-url-photoprism-originals
                  name: rclone-config
                  optional: true
            image: rclone/rclone:1.69
            name: rclone
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /config
              name: rclone-config
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /data
              name: app-data
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - emptyDir: {}
            name: tmp
          - name: app-data
            persistentVolumeClaim:
              claimName: photoprism-photoprism-originals
              readOnly: true
  schedule: 40 3 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
---
